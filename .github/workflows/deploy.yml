name: CI / Deploy MOHICAN Configurator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (single-file)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    # Only deploy from main when VPS secrets are configured.
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for s in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${{ secrets[s] }}" ]; then
              echo "::error::Secret $s is not set — add it in Repo Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /home/ninja/cs16-config/images"
          scp index.html ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ninja/cs16-config/index.html
          scp -r images/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ninja/cs16-config/images/ 2>/dev/null || true

      - name: Smoke test
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" https://cfg.mohican.xyz/)
          echo "https://cfg.mohican.xyz/ -> $code"
          test "$code" = "200"

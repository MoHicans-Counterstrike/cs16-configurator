name: CI / Deploy MOHICAN Configurator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted runner (xxl VPS). Builds every push AND every PR.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (single-file)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    # Runner lives ON the VPS — deploy is a local file copy.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy locally to web root
        run: |
          mkdir -p /home/ninja/cs16-config/images
          cp dist/index.html /home/ninja/cs16-config/index.html
          cp -r public/images/* /home/ninja/cs16-config/images/ 2>/dev/null || true
          cp -r public/maps /home/ninja/cs16-config/ 2>/dev/null || true
          echo "deployed $(md5sum /home/ninja/cs16-config/index.html)"

      - name: Smoke test
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" https://cfg.mohican.xyz/)
          echo "https://cfg.mohican.xyz/ -> $code"
          test "$code" = "200"
